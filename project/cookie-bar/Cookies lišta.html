<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>helen — cookies lišta · varianty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<template id="__bundler_thumbnail" data-bg-color="#1E1E1E">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1E1E1E"/>
    <circle cx="600" cy="400" r="150" fill="#FDFCF8"/>
    <circle cx="555" cy="360" r="16" fill="#1E1E1E"/>
    <circle cx="640" cy="380" r="13" fill="#1E1E1E"/>
    <circle cx="585" cy="450" r="14" fill="#1E1E1E"/>
    <circle cx="635" cy="440" r="10" fill="#0064AD"/>
    <circle cx="560" cy="425" r="9" fill="#0064AD"/>
  </svg>
</template>
<style>
  :root{
    --ink:#1E1E1E; --ink-2:#2E2E2E; --ink-soft:#4F4F4F;
    --teal:#0064AD; --teal-deep:#00343D; --teal-soft:#D6E8F4;
    --green:#7ED957; --green-deep:#4E9E32;
    --cream:#FDFCF8; --cream-2:#F4F1E8; --cream-3:#EAE5D6;
    --line:#E4DFD0; --line-dark:rgba(255,255,255,.12); --muted:#737373;
    --shadow-sm:0 1px 2px rgba(30,30,30,.05),0 2px 8px rgba(30,30,30,.05);
    --shadow-md:0 8px 24px rgba(30,30,30,.08),0 2px 6px rgba(30,30,30,.05);
    --shadow-lg:0 20px 50px -12px rgba(30,30,30,.28),0 6px 16px rgba(30,30,30,.08);
    --radius:14px; --radius-sm:10px; --radius-lg:22px;
    --serif:"Playfair Display","Iowan Old Style",Georgia,serif;
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; }

  /* ---------- shared cookie-bar atoms ---------- */
  .cbtn{
    display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
    padding:.78rem 1.3rem; border-radius:999px; border:1px solid transparent;
    font-family:var(--sans); font-weight:500; font-size:.92rem; cursor:pointer;
    white-space:nowrap; transition:transform .15s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
  }
  .cbtn:hover{ transform:translateY(-1px); }
  .cbtn-primary{ background:var(--teal); color:#fff; }
  .cbtn-primary:hover{ background:var(--teal-deep); box-shadow:0 8px 20px rgba(0,100,173,.3); }
  .cbtn-dark{ background:var(--ink); color:var(--cream); }
  .cbtn-dark:hover{ background:#000; }
  .cbtn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .cbtn-ghost:hover{ border-color:var(--ink); }
  .cbtn-ghost-light{ background:transparent; color:var(--cream); border-color:rgba(255,255,255,.28); }
  .cbtn-ghost-light:hover{ border-color:var(--cream); }
  .clink{
    background:transparent; border:0; cursor:pointer; font-family:var(--sans);
    font-size:.9rem; font-weight:500; color:var(--ink-soft);
    text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line);
    transition:color .15s;
  }
  .clink:hover{ color:var(--ink); }
  .clink-light{ color:rgba(253,252,248,.7); text-decoration-color:rgba(255,255,255,.25); }
  .clink-light:hover{ color:var(--cream); }
  .cookie-glyph{
    display:grid; place-items:center; flex-shrink:0;
    width:46px; height:46px; border-radius:50%;
    background:var(--teal-soft); color:var(--teal-deep);
  }
  .cookie-glyph .ti{ font-size:1.5rem; }

  /* ---------- faux page backdrop inside each artboard ---------- */
  .stage{ position:absolute; inset:0; overflow:hidden; }
  .stage-cream{ background:var(--cream); }
  .stage-cream::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(50% 40% at 88% 8%, rgba(0,100,173,.06), transparent 70%),
      linear-gradient(var(--cream-2), var(--cream-2)) 0 0/100% 64px no-repeat;
  }
  .stage-dark{ background:var(--ink); }
  .stage-dark::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(60% 50% at 82% 12%, rgba(0,100,173,.22), transparent 60%),
      radial-gradient(40% 40% at 12% 92%, rgba(0,100,173,.12), transparent 70%);
  }
  .faux-bar{
    position:absolute; top:0; left:0; right:0; height:54px; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; border-bottom:1px solid var(--line);
  }
  .stage-dark .faux-bar{ border-color:var(--line-dark); }
  .faux-logo{ font-family:var(--serif); font-size:1.25rem; font-weight:500; letter-spacing:-.02em; color:var(--ink); }
  .stage-dark .faux-logo{ color:var(--cream); }
  .faux-logo .dot{ color:var(--teal); }
  .faux-logo small{ font-family:var(--sans); font-size:.55rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-left:.45rem; }
  .faux-nav{ display:flex; gap:18px; }
  .faux-nav i{ display:block; width:46px; height:7px; border-radius:99px; background:var(--line); }
  .stage-dark .faux-nav i{ background:rgba(255,255,255,.14); }
  .faux-body{ position:absolute; left:26px; right:26px; top:88px; display:flex; flex-direction:column; gap:14px; z-index:1; }
  .faux-h{ font-family:var(--serif); font-size:1.9rem; font-weight:500; letter-spacing:-.01em; color:var(--ink); max-width:62%; line-height:1.08; }
  .stage-dark .faux-h{ color:var(--cream); }
  .faux-h .it{ font-style:italic; color:var(--teal); }
  .faux-line{ height:9px; border-radius:99px; background:var(--cream-3); }
  .stage-dark .faux-line{ background:rgba(255,255,255,.08); }
  .scrim{ position:absolute; inset:0; z-index:5; background:rgba(30,30,30,.28); backdrop-filter:blur(1px); }

  /* ---------- A: full-width strip ---------- */
  .barA{
    position:absolute; left:18px; right:18px; bottom:18px; z-index:10;
    background:var(--cream); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    display:flex; align-items:center; gap:1.25rem; padding:1.05rem 1.25rem;
  }
  .barA .copy{ flex:1; min-width:0; }
  .barA .copy h4{ font-family:var(--serif); font-weight:500; font-size:1.12rem; margin:0 0 .25rem; letter-spacing:-.01em; }
  .barA .copy p{ margin:0; font-size:.86rem; color:var(--ink-soft); line-height:1.5; max-width:54ch; }
  .barA .copy a{ color:var(--teal); text-decoration:underline; text-underline-offset:2px; }
  .barA .actions{ display:flex; align-items:center; gap:.6rem; flex-shrink:0; }

  /* ---------- B: corner card ---------- */
  .barB{
    position:absolute; left:22px; bottom:22px; z-index:10; width:340px;
    background:var(--cream); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg); padding:1.4rem 1.4rem 1.25rem;
  }
  .barB .pill, .barD .pill{
    display:inline-flex; align-items:center; gap:.45rem; font-size:.7rem; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--teal-deep);
    background:var(--teal-soft); padding:.32rem .7rem; border-radius:999px; margin-bottom:.85rem;
  }
  .barB .pill .ti, .barD .pill .ti{ font-size:.95rem; }
  .barB h4{ font-family:var(--serif); font-weight:500; font-size:1.3rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  .barB h4 .it{ font-style:italic; color:var(--teal); }
  .barB p{ margin:0 0 1.15rem; font-size:.88rem; color:var(--ink-soft); line-height:1.55; }
  .barB .actions{ display:flex; flex-direction:column; gap:.55rem; }
  .barB .actions .cbtn{ width:100%; }
  .barB .row2{ display:flex; gap:.55rem; }
  .barB .row2 .cbtn{ flex:1; }
  .barB .foot{ display:flex; justify-content:center; margin-top:.9rem; }

  /* ---------- C: dark strip ---------- */
  .barC{
    position:absolute; left:18px; right:18px; bottom:18px; z-index:10;
    background:var(--ink-2); border:1px solid var(--line-dark); border-radius:var(--radius-lg);
    box-shadow:0 24px 50px -12px rgba(0,0,0,.5);
    display:flex; align-items:center; gap:1.25rem; padding:1.05rem 1.25rem;
  }
  .barC .cookie-glyph{ background:rgba(0,100,173,.18); color:var(--teal-soft); }
  .barC .copy{ flex:1; min-width:0; }
  .barC .copy h4{ font-family:var(--serif); font-weight:500; font-size:1.12rem; margin:0 0 .25rem; color:var(--cream); letter-spacing:-.01em; }
  .barC .copy h4 .it{ font-style:italic; color:var(--teal-soft); }
  .barC .copy p{ margin:0; font-size:.86rem; color:rgba(253,252,248,.62); line-height:1.5; max-width:56ch; }
  .barC .copy a{ color:var(--teal-soft); text-decoration:underline; text-underline-offset:2px; }
  .barC .actions{ display:flex; align-items:center; gap:.6rem; flex-shrink:0; }

  /* ---------- D: preferences / settings ---------- */
  .barD{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%); z-index:10;
    width:min(480px, calc(100% - 44px));
    background:var(--cream); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg); padding:1.5rem 1.5rem 1.25rem;
  }
  .barD .head{ display:flex; align-items:flex-start; gap:.85rem; margin-bottom:1.15rem; }
  .barD .head h4{ font-family:var(--serif); font-weight:500; font-size:1.32rem; margin:0 0 .25rem; letter-spacing:-.01em; }
  .barD .head p{ margin:0; font-size:.84rem; color:var(--ink-soft); line-height:1.5; }
  .opt{ display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 0; border-top:1px solid var(--line); }
  .opt .ot{ font-weight:500; font-size:.92rem; }
  .opt .od{ font-size:.78rem; color:var(--muted); margin-top:.1rem; line-height:1.4; }
  .req{ font-size:.72rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--green-deep); }
  /* toggle */
  .tg{ position:relative; width:44px; height:26px; flex-shrink:0; }
  .tg input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .tg .track{ position:absolute; inset:0; border-radius:999px; background:var(--cream-3); transition:background .2s; }
  .tg .knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:transform .2s; }
  .tg input:checked + .track{ background:var(--teal); }
  .tg input:checked + .track + .knob{ transform:translateX(18px); }
  .tg.locked .track{ background:var(--teal-deep); opacity:.55; }
  .tg.locked .knob{ transform:translateX(18px); }
  .barD .actions{ display:flex; gap:.6rem; margin-top:1.15rem; }
  .barD .actions .cbtn{ flex:1; }

  /* spec note under artboards */
  .legend{ font-family:var(--sans); font-size:.82rem; color:var(--muted); line-height:1.6; }
  .legend b{ color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function FauxPage({ dark, scrim }){
  return (
    <div className={"stage " + (dark ? "stage-dark" : "stage-cream")}>
      <div className="faux-bar">
        <span className="faux-logo">helen<span className="dot">.</span><small>autoškola</small></span>
        <span className="faux-nav"><i/><i/><i/></span>
      </div>
      <div className="faux-body">
        <div className="faux-h">Autoškola pro <span className="it">strašpytlíky</span> v Brně</div>
        <div className="faux-line" style={{width:'70%'}}/>
        <div className="faux-line" style={{width:'52%'}}/>
      </div>
      {scrim && <div className="scrim"/>}
    </div>
  );
}

const ABW = 760, ABH = 470;

function App(){
  return (
    <DesignCanvas>
      <DCSection id="bars" title="Cookies lišta" subtitle="Varianty pro web autoškoly helen — krémová / inkoust, Playfair + DM Sans, pilulkové buttony">

        {/* A — full-width strip, light */}
        <DCArtboard id="a" label="A · Spodní lišta (světlá)" width={ABW} height={ABH}>
          <FauxPage/>
          <div className="barA">
            <div className="cookie-glyph"><i className="ti ti-cookie"></i></div>
            <div className="copy">
              <h4>Cookies? U nás bez stresu.</h4>
              <p>Používáme cookies, aby web fungoval hladce a my věděli, co vás zajímá. Žádné strašení — víc v <a href="#">zásadách ochrany soukromí</a>.</p>
            </div>
            <div className="actions">
              <button className="clink">Nastavení</button>
              <button className="cbtn cbtn-ghost">Odmítnout</button>
              <button className="cbtn cbtn-primary">Přijmout vše</button>
            </div>
          </div>
        </DCArtboard>

        {/* B — corner card */}
        <DCArtboard id="b" label="B · Rohová karta" width={ABW} height={ABH}>
          <FauxPage/>
          <div className="barB">
            <span className="pill"><i className="ti ti-cookie"></i> Sušenky</span>
            <h4>Pár <span className="it">drobků</span> pro lepší web</h4>
            <p>Cookies nám pomáhají, aby vám web jezdil hladce. Vy řídíte — můžete přijmout vše, odmítnout nebo si vybrat.</p>
            <div className="actions">
              <button className="cbtn cbtn-primary">Přijmout vše</button>
              <div className="row2">
                <button className="cbtn cbtn-ghost">Odmítnout</button>
                <button className="cbtn cbtn-ghost">Nastavení</button>
              </div>
            </div>
            <div className="foot"><button className="clink">Zásady ochrany soukromí</button></div>
          </div>
        </DCArtboard>

        {/* C — dark strip */}
        <DCArtboard id="c" label="C · Spodní lišta (inkoust)" width={ABW} height={ABH}>
          <FauxPage dark/>
          <div className="barC">
            <div className="cookie-glyph"><i className="ti ti-cookie"></i></div>
            <div className="copy">
              <h4>Cookies? <span className="it">Bez paniky.</span></h4>
              <p>Pomáhají webu fungovat a nám rozumět návštěvám. Vše si můžete nastavit — detaily v <a href="#">zásadách</a>.</p>
            </div>
            <div className="actions">
              <button className="clink clink-light">Nastavení</button>
              <button className="cbtn cbtn-ghost-light">Odmítnout</button>
              <button className="cbtn cbtn-primary">Přijmout vše</button>
            </div>
          </div>
        </DCArtboard>

        {/* D — preferences */}
        <DCArtboard id="d" label="D · Detailní nastavení" width={ABW} height={ABH}>
          <FauxPage scrim/>
          <div className="barD">
            <div className="head">
              <div className="cookie-glyph"><i className="ti ti-adjustments-horizontal"></i></div>
              <div>
                <h4>Vyberte si své cookies</h4>
                <p>Nezbytné necháme zapnuté, zbytek je na vás.</p>
              </div>
            </div>

            <div className="opt">
              <div>
                <div className="ot">Nezbytné</div>
                <div className="od">Aby web vůbec fungoval — přihlášení, formuláře, bezpečnost.</div>
              </div>
              <span className="req">Vždy</span>
            </div>
            <div className="opt">
              <div>
                <div className="ot">Analytické</div>
                <div className="od">Anonymně měří návštěvnost, ať víme, co zlepšit.</div>
              </div>
              <label className="tg"><input type="checkbox" defaultChecked/><span className="track"></span><span className="knob"></span></label>
            </div>
            <div className="opt">
              <div>
                <div className="ot">Marketingové</div>
                <div className="od">Relevantní nabídky kurzů na sociálních sítích.</div>
              </div>
              <label className="tg"><input type="checkbox"/><span className="track"></span><span className="knob"></span></label>
            </div>

            <div className="actions">
              <button className="cbtn cbtn-ghost">Odmítnout vše</button>
              <button className="cbtn cbtn-primary">Uložit výběr</button>
            </div>
          </div>
        </DCArtboard>

        {/* E — B text + D look */}
        <DCArtboard id="e" label="E · Text B + vzhled D" width={ABW} height={ABH}>
          <FauxPage scrim/>
          <div className="barD">
            <span className="pill"><i className="ti ti-cookie"></i> Sušenky</span>
            <div className="head" style={{marginTop:'.85rem'}}>
              <div>
                <h4>Pár <span className="it">drobků</span> pro lepší web</h4>
                <p>Cookies nám pomáhají, aby vám web jezdil hladce. Vy řídíte — přijměte vše, nebo si vyberte.</p>
              </div>
            </div>

            <div className="opt">
              <div>
                <div className="ot">Nezbytné</div>
                <div className="od">Aby web vůbec fungoval — přihlášení, formuláře, bezpečnost.</div>
              </div>
              <span className="req">Vždy</span>
            </div>
            <div className="opt">
              <div>
                <div className="ot">Analytické</div>
                <div className="od">Anonymně měří návštěvnost, ať víme, co zlepšit.</div>
              </div>
              <label className="tg"><input type="checkbox" defaultChecked/><span className="track"></span><span className="knob"></span></label>
            </div>
            <div className="opt">
              <div>
                <div className="ot">Marketingové</div>
                <div className="od">Relevantní nabídky kurzů na sociálních sítích.</div>
              </div>
              <label className="tg"><input type="checkbox"/><span className="track"></span><span className="knob"></span></label>
            </div>

            <div className="actions">
              <button className="cbtn cbtn-ghost">Jen nezbytné</button>
              <button className="cbtn cbtn-primary">Přijmout vše</button>
            </div>
            <div className="foot" style={{display:'flex',justifyContent:'center',marginTop:'.9rem'}}>
              <button className="clink">Zásady ochrany soukromí</button>
            </div>
          </div>
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
